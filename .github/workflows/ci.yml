name: Shorts Factory CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image test dependency
        run: python -m pip install "Pillow>=11.0,<13.0"
      - name: Python syntax and logic tests
        run: |
          python -m py_compile app.py pipeline.py branding.py review.py brand_only.py show_style.py overlay_cleanup.py
          python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax
        run: node --check static/app.js
      - name: Review studio interaction contract
        run: node tests/ui_contract.cjs
      - name: Check Dockerfile build
        run: docker build -t shorts-factory-test .
      - name: Test full container upload and export
        run: bash scripts/smoke_test.sh
